title: 工程知识库
description: 个人工程实践知识库 - 沉淀 Java、MySQL、系统设计、期权业务、网络与操作系统、数据结构与算法、设计模式、重构案例和 AI 协作技巧
theme: jekyll-theme-cayman
lang: zh-CN
show_downloads: false

# 项目站（username.github.io/<仓库名>/）需配置，否则主题与生成链接可能指向错误根路径
url: https://youmu1.github.io
baseurl: "/knowledge"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - .obsidian/
  - terminals/
  - "*.base"
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .gitignore
  - README_OLD.md

include:
  - .nojekyll
