title: 工程知识库
description: 个人工程实践知识库 - 沉淀 Java、MySQL、系统设计、网络与操作系统、设计模式、重构案例和 AI 协作技巧
theme: jekyll-theme-cayman
lang: zh-CN
show_downloads: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - .obsidian/
  - terminals/
  - "*.base"
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .gitignore
  - README_OLD.md

include:
  - .nojekyll
